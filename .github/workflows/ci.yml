name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .[dev]
      - name: Unit tests
        run: pytest -q
      - name: Smoke simulation (500 ticks) + ledger audit
        run: |
          python -m colony --db smoke.db init --config config.default.json
          python -m colony --db smoke.db run --ticks 500
          python -m colony --db smoke.db verify
          python -m colony --db smoke.db report
